name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "25"

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Cache flatc
        uses: actions/cache@v4
        with:
          path: build/tools
          key: flatc-${{ runner.os }}-${{ hashFiles('tools/CMakeLists.txt') }}

      - name: Cache C++ dependencies
        uses: actions/cache@v4
        with:
          path: build/node/_deps
          key: cpp-deps-${{ runner.os }}-${{ hashFiles('node/cmake/Dependencies.cmake') }}

      - name: Unit tests
        run: make test

      # A cold runner downloads Minecraft and fabric-api first, hence the long
      # timeout.
      - name: Server boot
        run: make test-boot
        env:
          STARTUP_TIMEOUT: "600"

      - name: Load mod
        run: make test-load

      - name: Game tests
        run: make test-game

      - name: Upload boot and game test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            server/build/boot-smoke-test.log
            server/build/load-smoke-test.log
            server/build/gametest/
            server/run/gametest/logs/
            server/run/gametest/crash-reports/
          if-no-files-found: ignore

  e2e:
    name: End to end ${{ matrix.offload }} ${{ matrix.submode }} ${{ matrix.faults }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Each run reports its own failure.
      fail-fast: false
      matrix:
        include:
          - { offload: shadow, submode: batch, faults: "" }
          - { offload: shadow, submode: stream, faults: "" }
          - { offload: on, submode: batch, faults: "" }
          - { offload: on, submode: stream, faults: "" }
          - { offload: on, submode: batch, faults: failover }
          - { offload: on, submode: stream, faults: failover }
          - { offload: on, submode: batch, faults: split }
          - { offload: on, submode: stream, faults: split }
          - { offload: on, submode: batch, faults: replica }
          - { offload: on, submode: stream, faults: replica }
          - { offload: shadow, submode: batch, faults: blocks }
          - { offload: shadow, submode: batch, faults: net }
          - { offload: shadow, submode: batch, faults: topology }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Cache flatc
        uses: actions/cache@v4
        with:
          path: build/tools
          key: flatc-${{ runner.os }}-${{ hashFiles('tools/CMakeLists.txt') }}

      - name: Cache C++ dependencies
        uses: actions/cache@v4
        with:
          path: build/node/_deps
          key: cpp-deps-${{ runner.os }}-${{ hashFiles('node/cmake/Dependencies.cmake') }}

      # A cold runner downloads Minecraft and fabric-api first, hence the long
      # timeout.
      - name: End to end
        run: >
          make test-e2e
          OFFLOAD=${{ matrix.offload }} SUBMODE=${{ matrix.submode }} FAULTS=${{ matrix.faults }}
        env:
          STARTUP_TIMEOUT: "600"

      - name: Upload end-to-end logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.offload }}-${{ matrix.submode }}-${{ matrix.faults || 'none' }}
          path: server/build/e2e-*.log
          if-no-files-found: ignore

  sanitize:
    name: Node under ${{ matrix.sanitizer }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: address,undefined
            cxx: g++
          - sanitizer: thread
            cxx: clang++
    env:
      CXX: ${{ matrix.cxx }}
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4

      - name: Cache flatc
        uses: actions/cache@v4
        with:
          path: build/tools
          key: flatc-${{ runner.os }}-${{ hashFiles('tools/CMakeLists.txt') }}

      # TSan cannot map the address bits recent kernels randomize.
      - name: Narrow address randomization
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Unit tests
        run: make node-test MAESTRO_SANITIZE=${{ matrix.sanitizer }}

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Cache flatc
        uses: actions/cache@v4
        with:
          path: build/tools
          key: flatc-${{ runner.os }}-${{ hashFiles('tools/CMakeLists.txt') }}

      - name: Cache C++ dependencies
        uses: actions/cache@v4
        with:
          path: build/node-coverage/_deps
          key: cpp-deps-coverage-${{ runner.os }}-${{ hashFiles('node/cmake/Dependencies.cmake') }}

      - name: Measure
        run: make coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: build/coverage
          if-no-files-found: ignore

  fuzz:
    name: Fuzz ${{ matrix.tier }} ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Each shard reports its own failing seeds.
      fail-fast: false
      matrix:
        tier: [shallow, deep]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
        exclude:
          - tier: shallow
            shard: 4
          - tier: shallow
            shard: 5
          - tier: shallow
            shard: 6
          - tier: shallow
            shard: 7
        # About 15 minutes per shard.
        include:
          - tier: shallow
            seeds: 8000
          - tier: deep
            seeds: 2500
          - tier: coverage
            shard: 0
            seeds: 2000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Cache flatc
        uses: actions/cache@v4
        with:
          path: build/tools
          key: flatc-${{ runner.os }}-${{ hashFiles('tools/CMakeLists.txt') }}

      - name: Seed sweep
        run: |
          make fuzz \
            TIER=${{ matrix.tier }} \
            SEED=$((1 + ${{ matrix.shard }} * ${{ matrix.seeds }})) \
            RUNS=${{ matrix.seeds }}

      - name: Upload fuzz report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-report-${{ matrix.tier }}-${{ matrix.shard }}
          path: server/controller/build/reports/tests/fuzz-${{ matrix.tier }}
          if-no-files-found: ignore

  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The local google-java-format hook needs a JDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: pip install pre-commit

      - run: pre-commit run --all-files --show-diff-on-failure
