plugins {
  id 'java-library'
}

group = project.maven_group
version = project.mod_version

repositories {
  mavenCentral()
}

// flatc emits the FlatBuffers bindings here (via `make schema-java`). They live
// with the controller because the transport seam carries encoded frames; the mod
// project sees them through the `api` dependency below.
sourceSets.main.java.srcDir "${projectDir}/src/generated/java"

dependencies {
  api "com.google.flatbuffers:flatbuffers-java:${flatbuffers_version}"

  testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
}

tasks.withType(JavaCompile).configureEach {
  options.encoding = 'UTF-8'
  options.release = 25
}

def fuzzTiers = [shallow: "5000", deep: "1500", coverage: "2000"]

// Forwarded to the forked test JVM, which does not inherit the Gradle JVM's
// properties. `make fuzz SEED=n` replays a seed reported by a failing run.
def forwardSweepProperties = { Test task, String defaultRuns ->
  ["maestro.dst.seed", "maestro.dst.runs"].each { key ->
    def value = System.getProperty(key)
    if (value != null) {
      task.systemProperty key, value
    }
  }
  if (defaultRuns != null && System.getProperty("maestro.dst.runs") == null) {
    task.systemProperty "maestro.dst.runs", defaultRuns
  }

  // A seed printed on failure is the whole replay story, so keep test output.
  task.testLogging {
    showStandardStreams = true
    exceptionFormat = 'full'
  }
}

// Parity fixtures recorded from vanilla by `make capture`, shared with the node.
def parityFixtures = file("${rootDir}/../fixtures/parity")

// Node conformance scripts, written by `make conformance` and replayed by the node.
def conformanceFixtures = file("${rootDir}/../fixtures/conformance")

test {
  useJUnitPlatform {
    excludeTags 'fuzz'
  }
  forwardSweepProperties(delegate, null)
  systemProperty 'maestro.fixtures', parityFixtures.absolutePath
  inputs.dir(parityFixtures).withPropertyName('parityFixtures').optional()
  systemProperty 'maestro.conformance', conformanceFixtures.absolutePath
  inputs.dir(conformanceFixtures).withPropertyName('conformanceFixtures').optional()
  if (System.getProperty('maestro.conformance.write') != null) {
    systemProperty 'maestro.conformance.write', 'true'
    outputs.upToDateWhen { false }
  }
}

// One task per tier.
fuzzTiers.each { tier, defaultRuns ->
  tasks.register("fuzz-${tier}", Test) {
    group = 'verification'
    description = "Runs the ${tier} deterministic simulation seed sweeps."
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
      includeTags "fuzz & ${tier}"
    }
    forwardSweepProperties(delegate, defaultRuns)

    outputs.upToDateWhen { false }
  }
}

tasks.register('fuzz') {
  group = 'verification'
  description = 'Runs every tier of the deterministic simulation seed sweeps.'
  dependsOn fuzzTiers.keySet().collect { "fuzz-${it}" }
}
