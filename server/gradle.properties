org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8

# Fabric Loom. 26.1 uses the `net.fabricmc.fabric-loom` plugin id.
loom_version=1.18.0-alpha.9

# Minecraft / Fabric
minecraft_version=26.1
loader_version=0.18.4
# fabric-api is published with a +<mc> suffix; 0.145.1 for 26.1 is 0.145.1+26.1
fabric_version=0.145.1+26.1

# Mod identity
maven_group=com.smpler.maestro
archives_base_name=maestro
mod_version=0.1.0

# Bundled (Jar-in-Jar) libraries. flatbuffers_version MUST match the flatc used
# to generate the bindings (see tools/CMakeLists.txt and node dependencies).
flatbuffers_version=25.2.10
opentelemetry_version=1.51.0

# Test-only, shared by the mod and the controller module.
junit_version=5.11.4
