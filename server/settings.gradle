pluginManagement {
  repositories {
    maven {
      name = 'Fabric'
      url = 'https://maven.fabricmc.net/'
    }
    mavenCentral()
    gradlePluginPortal()
  }
}

rootProject.name = 'maestro'

// The controller is a plain Java module: no Loom, no Minecraft, no Fabric. Its
// deterministic simulation tests therefore run on a bare JVM, and controller
// code cannot reach a game class even by accident.
include 'controller'
