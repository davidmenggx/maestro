pluginManagement {
  repositories {
    maven {
      name = 'Fabric'
      url = 'https://maven.fabricmc.net/'
    }
    mavenCentral()
    gradlePluginPortal()
  }
}

rootProject.name = 'maestro'

// The controller is a plain Java module (no Loom, Minecraft or Fabric), so its simulation
// tests run on a bare JVM and it cannot reach a game class.
include 'controller'
