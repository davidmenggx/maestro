plugins {
  // 26.1 uses the new Loom plugin id (was `fabric-loom`).
  id 'net.fabricmc.fabric-loom' version "${loom_version}"
  id 'java'
}

version = project.mod_version
group = project.maven_group

base {
  archivesName = project.archives_base_name
}

repositories {
  mavenCentral()
  maven {
    name = 'Fabric'
    url = 'https://maven.fabricmc.net/'
  }
}

// Capture and its probe are a separate dev mod on the `runServer` classpath only.
sourceSets {
  dev {
    compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
    runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
  }
  // The load generator, a separate mod loaded beside the released one for experiments. It hooks
  // nothing on the search path, so a run measures the released mod alone.
  load {
    compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
    runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
  }
  // Tests that need the mixins applied. They run under Fabric's loader, which refuses block
  // tags no server bound, so plain tests stay on a bare JVM.
  mixinTest {
    compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
    runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
  }
  // Tests that need a running server: the overworld, its chunks and its mobs. A separate mod run
  // headless by `runGameTest`.
  gametest {
    compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
    runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
  }
}

loom {
  mods {
    maestro {
      sourceSet sourceSets.main
    }
    "maestro-dev" {
      sourceSet sourceSets.dev
    }
    "maestro-load" {
      sourceSet sourceSets.load
    }
    "maestro-gametest" {
      sourceSet sourceSets.gametest
    }
  }
  runs {
    server {
      source sourceSets.dev
    }
    // The released mod alone, as a server would load it. The boot smoke test uses it.
    releaseServer {
      inherit server
      configName = "Release Server"
      source sourceSets.main
    }
    // The released mod with the load generator. The end-to-end test uses it.
    loadServer {
      inherit server
      configName = "Load Server"
      source sourceSets.load
    }
    // The game tests, on a server of their own that exits with the number that failed.
    gameTest {
      inherit server
      configName = "Game Test"
      source sourceSets.gametest
      runDir "run/gametest"
      vmArg "-Dfabric-api.gametest"
      vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.file('gametest/TEST-gametest.xml').get().asFile}"
    }
  }
}

configurations {
  // Resolved separately so the whole OpenTelemetry graph can be nested. See the
  // `include` loop below.
  otelBundle

  // Merged into the mod jar, not nested. Non-transitive: flatbuffers is nested on its own.
  controllerClasses {
    transitive = false
  }
}

dependencies {
  // 26.1 is unobfuscated: no `mappings`, and mod dependencies are plain `implementation`.
  minecraft "com.mojang:minecraft:${minecraft_version}"
  implementation "net.fabricmc:fabric-loader:${loader_version}"
  implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

  // Controller logic and the generated FlatBuffers bindings. No Minecraft types may leak in.
  implementation project(':controller')
  controllerClasses project(':controller')

  // Bundled via Jar-in-Jar. It reaches the compile classpath through the controller's `api`.
  include "com.google.flatbuffers:flatbuffers-java:${flatbuffers_version}"

  // OpenTelemetry is wired onto the compile/runtime classpath via the BOM, and
  // mirrored into `otelBundle` so the resolved graph can be Jar-in-Jar'd.
  implementation platform("io.opentelemetry:opentelemetry-bom:${opentelemetry_version}")
  implementation "io.opentelemetry:opentelemetry-api"
  implementation "io.opentelemetry:opentelemetry-sdk"
  implementation "io.opentelemetry:opentelemetry-exporter-otlp"
  implementation "io.opentelemetry.instrumentation:opentelemetry-runtime-telemetry-java8:${opentelemetry_instrumentation_version}"

  otelBundle platform("io.opentelemetry:opentelemetry-bom:${opentelemetry_version}")
  otelBundle "io.opentelemetry:opentelemetry-api"
  otelBundle "io.opentelemetry:opentelemetry-sdk"
  otelBundle "io.opentelemetry:opentelemetry-exporter-otlp"
  otelBundle "io.opentelemetry.instrumentation:opentelemetry-runtime-telemetry-java8:${opentelemetry_instrumentation_version}"

  testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"

  mixinTestImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
  mixinTestImplementation "net.fabricmc:fabric-loader-junit:${loader_version}"
  mixinTestRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// `include` does not follow transitive dependencies, so each `otelBundle` artifact is nested.
configurations.otelBundle.resolvedConfiguration.resolvedArtifacts.each { artifact ->
  def id = artifact.moduleVersion.id
  dependencies.add("include", "${id.group}:${id.name}:${id.version}")
}

java {
  // Minecraft 26.1 requires Java 25.
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
  withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
  options.encoding = 'UTF-8'
  options.release = 25
}

// The load mod's logic that needs no game runs with the plain unit tests.
sourceSets.test.compileClasspath += sourceSets.load.output
sourceSets.test.runtimeClasspath += sourceSets.load.output

test {
  useJUnitPlatform()
}

tasks.register('mixinTest', Test) {
  description = 'Runs the tests that need the mod\'s mixins applied.'
  group = 'verification'
  testClassesDirs = sourceSets.mixinTest.output.classesDirs
  classpath = sourceSets.mixinTest.runtimeClasspath
  useJUnitPlatform()
  // The mod's mixins are for the dedicated server, so the loader runs the tests as one.
  systemProperty 'fabric.side', 'server'
}

check.dependsOn tasks.named('mixinTest')

// Both mods take their version from the project.
tasks.withType(ProcessResources).configureEach {
  inputs.property "version", project.version
  filesMatching("fabric.mod.json") {
    expand "version": project.version
  }
}

// Loom's `server` run manages neither the EULA nor `server.properties`. A superflat, fixed-seed
// overworld keeps dev and benchmark runs identical. `max-tick-time=-1` stops the watchdog killing
// a server paused in a debugger. Mobs run with no player online, so it never pauses when empty.
def devRunDir = file("${projectDir}/run")
def worldFixtureDir = file("${projectDir}/../worlds")
def devServerProperties = [
  "level-type": "minecraft:flat",
  "level-seed": "maestro",
  "online-mode": "false",
  "spawn-protection": "0",
  "max-tick-time": "-1",
  "pause-when-empty-seconds": "0",
]

tasks.matching { it.name in ["runServer", "runReleaseServer", "runLoadServer"] }.configureEach {
  doFirst {
    devRunDir.mkdirs()
    new File(devRunDir, "eula.txt").text = "eula=true\n"

    // `-Pworld=<name>` boots against the committed fixture in `worlds/<name>`.
    def levelName = "world"
    if (project.hasProperty("world")) {
      def fixture = new File(worldFixtureDir, project.world)
      if (!new File(fixture, "level.dat").isFile()) {
        def available = worldFixtureDir.isDirectory()
            ? worldFixtureDir.listFiles().findAll { it.isDirectory() }.collect { it.name }.sort()
            : []
        throw new GradleException(
            "No world fixture at ${fixture} (expected a level.dat inside). Available: ${available}")
      }

      levelName = "world-${project.world}"
      def working = new File(devRunDir, levelName)
      // Each run starts from a fresh fixture copy. `-PkeepWorld` keeps the working copy.
      if (working.isDirectory() && project.hasProperty("keepWorld")) {
        logger.lifecycle("Maestro: reusing existing world at ${working}")
      } else {
        if (working.isDirectory()) {
          working.deleteDir()
        }
        logger.lifecycle("Maestro: copying world fixture '${project.world}' to ${working}")
        copy {
          from fixture
          into working
        }
      }
    }

    def propertiesFile = new File(devRunDir, "server.properties")
    def properties = new Properties()
    if (propertiesFile.exists()) {
      propertiesFile.withInputStream { properties.load(it) }
    }
    devServerProperties.each { key, value -> properties.setProperty(key, value) }
    // Always written, so a previous `-Pworld=` run's `level-name` cannot redirect the next boot.
    properties.setProperty("level-name", levelName)
    propertiesFile.withOutputStream { properties.store(it, "Written by the server run tasks") }
  }
}

// The game tests start from a fresh world, with a fleet whose one node never answers: the fleet
// watches the overworld as it would in production, while shadow mode keeps every search vanilla's.
def gameTestRunDir = file("${projectDir}/run/gametest")
def gameTestConfig = [
  subMode: "batch",
  offload: "shadow",
  nodes: [[host: "127.0.0.1", worldPort: 25797, controlPort: 25798, requestPort: 25799]],
  areaCells: 5,
  spares: 0,
]

tasks.matching { it.name == "runGameTest" }.configureEach {
  doFirst {
    project.delete(new File(gameTestRunDir, "world"))
    def config = new File(gameTestRunDir, "config/maestro.json")
    config.parentFile.mkdirs()
    config.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(gameTestConfig))
  }
}

jar {
  // The closure keeps resolution out of the configuration phase.
  dependsOn configurations.controllerClasses
  from({ configurations.controllerClasses.collect { zipTree(it) } }) {
    exclude 'META-INF/**'
  }

  // LICENSE lives at the repository root, one level above the Gradle project.
  def licenseFile = file("${projectDir}/../LICENSE")
  if (licenseFile.exists()) {
    from(licenseFile) {
      rename { "${it}_${project.base.archivesName.get()}" }
    }
  }
}

// The load mod's own jar, deployed beside the released one for live experiments.
def loadJar = tasks.register('loadJar', Jar) {
  archiveBaseName = "${project.base.archivesName.get()}-load"
  from sourceSets.load.output
  from(file("${projectDir}/../LICENSE")) {
    rename { "${it}_${archiveBaseName.get()}" }
  }
}
tasks.named('assemble') {
  dependsOn loadJar
}
