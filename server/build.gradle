plugins {
  // 26.1 uses the new Loom plugin id (was `fabric-loom`).
  id 'net.fabricmc.fabric-loom' version "${loom_version}"
  id 'java'
}

version = project.mod_version
group = project.maven_group

base {
  archivesName = project.archives_base_name
}

repositories {
  mavenCentral()
  maven {
    name = 'Fabric'
    url = 'https://maven.fabricmc.net/'
  }
}

// flatc emits the FlatBuffers bindings here (via `make schema-java`); treat the
// directory as an extra source root rather than committing generated code.
sourceSets.main.java.srcDir "${projectDir}/src/generated/java"

dependencies {
  // Minecraft 26.1 is unobfuscated: there is no `mappings` dependency, and mod
  // dependencies are plain `implementation` (nothing is remapped).
  minecraft "com.mojang:minecraft:${minecraft_version}"
  implementation "net.fabricmc:fabric-loader:${loader_version}"
  implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

  // flatbuffers-java has no transitive dependencies, so it is bundled into the
  // mod jar via Fabric's Jar-in-Jar (`include`).
  include implementation("com.google.flatbuffers:flatbuffers-java:${flatbuffers_version}")

  // OpenTelemetry is wired onto the compile/runtime classpath via the BOM.
  // It is NOT Jar-in-Jar'd yet: Loom's `include` does not pull transitives, so
  // bundling the full OTel graph for the modded runtime is a follow-up.
  implementation platform("io.opentelemetry:opentelemetry-bom:${opentelemetry_version}")
  implementation "io.opentelemetry:opentelemetry-api"
  implementation "io.opentelemetry:opentelemetry-sdk"
  implementation "io.opentelemetry:opentelemetry-exporter-otlp"

  testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

java {
  // Minecraft 26.1 requires Java 25.
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
  withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
  options.encoding = 'UTF-8'
  options.release = 25
}

test {
  useJUnitPlatform()
}

processResources {
  inputs.property "version", project.version
  filesMatching("fabric.mod.json") {
    expand "version": project.version
  }
}

jar {
  // LICENSE lives at the repository root, one level above the Gradle project.
  def licenseFile = file("${projectDir}/../LICENSE")
  if (licenseFile.exists()) {
    from(licenseFile) {
      rename { "${it}_${project.base.archivesName.get()}" }
    }
  }
}
